name: Skill improvement
description: Propose a focused change to Documentory's behavior or coverage.
title: "[Proposal]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which documentation task or reader is underserved?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Reproducible example
      description: Show the prompt, artifact, or output that exposes the gap.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Smallest useful change
      description: Which decision should the skill make differently?
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Context and maintenance cost
      description: What new text, reference, or validation would this add, and when would it load?
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: This proposal does not require a documentation file or folder structure.
          required: true
