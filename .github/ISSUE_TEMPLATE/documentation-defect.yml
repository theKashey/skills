name: Documentation defect
description: Report guidance that permits inaccurate, incomplete, or unusable documentation.
title: "[Defect]: "
body:
  - type: textarea
    id: task
    attributes:
      label: Documentation task
      description: What did you ask the agent to create, revise, or audit?
      placeholder: Include the relevant prompt without secrets or private source.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: What did the agent produce or fail to detect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Current-truth evidence
      description: Which public export, type, test, example, or artifact proves the defect?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
      description: What decision or safe action should the documentation have enabled?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Documentory revision
      description: Commit SHA, tag, or installation date.
  - type: checkboxes
    id: safety
    attributes:
      label: Public report
      options:
        - label: I removed secrets, private source, and sensitive security details.
          required: true
