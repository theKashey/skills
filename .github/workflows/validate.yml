name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    name: Agent Skill
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Documentory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out the Agent Skills reference validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: agentskills/agentskills
          ref: 38a2ff82958afee88dadf4831509e6f7e9d8ef4e
          path: .validation/agent-skills

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the reference validator
        run: python -m pip install ./.validation/agent-skills/skills-ref

      - name: Validate the skill specification
        run: skills-ref validate documentory

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"

      - name: Verify distribution discovery
        run: npx --yes skills@1.5.20 add . --list
